name: ECRIP Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ecrip_test
          POSTGRES_USER: ecrip
          POSTGRES_PASSWORD: secretpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api/requirements.txt
          pip install pytest pytest-cov flake8

      - name: Lint with Flake8
        run: |
          flake8 services/api/app --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Unit and Integration Tests
        env:
          DATABASE_URL: postgresql://ecrip:secretpassword@localhost:5432/ecrip_test
        run: |
          pytest services/api/app/tests --cov=services/api/app --cov-report=xml

      - name: Build Docker Container
        run: |
          docker build -t ecrip-api:latest -f services/api/Dockerfile services/api

  security-and-compliance-scan:
    needs: validate-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'